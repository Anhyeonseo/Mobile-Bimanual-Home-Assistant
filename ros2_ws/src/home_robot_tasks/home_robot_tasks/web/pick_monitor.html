<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick Station · 로봇 작업 모니터</title>
<style>
:root{color-scheme:dark;--bg:#101619;--card:#192226;--line:#304047;--ink:#edf4f1;--muted:#9db2b7;--green:#a5e6c2;--orange:#ffc593}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:38px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:17px;margin:0 0 15px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px}.muted{color:var(--muted)}.tag{padding:7px 12px;border:1px solid var(--line);border-radius:30px;font-size:12px}.mode{margin:25px 0 20px;padding:12px 16px;background:#27342f;border-left:3px solid var(--green)}.mode.live{background:#35291e;border-color:var(--orange)}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:24px}.hero{font-size:29px;font-weight:650;margin:5px 0}.statusline{display:flex;gap:10px;align-items:center}.dot{height:8px;width:8px;background:var(--green);border-radius:50%}.request{display:flex;gap:10px;margin:20px 0 10px}input{min-width:0;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:12px;font:inherit}button{border:0;border-radius:8px;font:inherit;font-weight:650;cursor:pointer;padding:11px 16px;background:var(--green);color:#14231b}button:disabled{opacity:.35;cursor:default}.stop{color:#ffb6ac;background:#3e2726;margin-bottom:10px}.stage{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.stage:last-child{border:0}.stage .num{color:var(--muted);font-size:12px;padding-top:3px}.stage.running{color:var(--green)}.stage.failed,.stage.cancelled{color:#ffb6ac}.stage.waiting,.stage.unknown{color:#7e949b}.small{font-size:12px}.preview{min-height:245px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px dashed var(--line);border-radius:8px;text-align:center;padding:12px}.preview img{display:block;width:100%;max-height:430px;object-fit:contain}.preview a{display:block;width:100%}a{color:var(--green)}.result{margin-top:18px;padding:14px;background:var(--bg);border-radius:8px}.logs{font:12px/1.8 ui-monospace,monospace;max-height:240px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.bottom{margin-top:20px}.error{color:#ffb6ac}.metric{font-size:13px;color:var(--muted)}.empty{padding:45px 15px;color:var(--muted)}footer{margin-top:22px;color:var(--muted);font-size:12px}.history{display:flex;gap:14px;flex-wrap:wrap}.history span{border-bottom:1px solid var(--line);padding:7px 0}.assets{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px}@media(max-width:760px){main{padding:22px 16px}.grid{grid-template-columns:1fr}header{align-items:flex-start}.request{flex-wrap:wrap}.request input{flex-basis:100%}.card{padding:18px}h1{font-size:25px}}
.operation{margin:16px 0 4px}.operation select{margin-left:8px;background:var(--bg);color:var(--ink);padding:7px;border:1px solid var(--line);border-radius:6px}.operator-confirm input{width:auto}.operator-confirm{margin-top:8px;display:block}.operator-confirm[hidden]{display:none}</style></head><body><main>
<header><div><div class="eyebrow">MOBILE BIMANUAL HOME ASSISTANT</div><h1>Pick Station</h1><div class="muted">고정 위치 집기 · 임시 작업 모니터</div></div><div class="tag" id="connection">연결 중</div></header>
<div class="mode" id="mode">실행 모드를 확인하고 있습니다.</div>
<div class="grid"><section class="card"><div class="statusline"><span class="dot"></span><span class="small muted">CURRENT STEP</span></div><div class="hero" id="phase">프로그램 준비</div><div class="metric" id="elapsed">—</div><div class="small muted" id="detail"></div>
<div id="stationOptions" class="operation" hidden><label>작업<select id="operation"><option value="observe-rise-pick">하단 관측 → 최상단 상승 → 집기</option><option value="top-pregrasp-check" selected>최상단 · 손끝 높이 점검</option><option value="top-pick">최상단 · 실물 파지</option><option value="top-inspect">최상단 · 카메라 검사</option><option value="top-align-pick">최상단 · 통합 파지 (필요 시 베이스 이동)</option><option value="top-align">최상단 · 베이스 좌우 정렬 (왼팔 기준)</option><option value="bottom-pick">최하단 · 실물 파지</option><option id="resumeOption" value="resume-top-pick" hidden>이전 하단 관측 → 현재 높이에서 이어 집기</option></select></label><label id="bottomConfirm" class="operator-confirm" hidden><input id="supportedBottom" type="checkbox"> <span id="confirmLabel"></span></label><div id="operationHint" class="small muted"></div></div>
<form class="request" id="form"><input id="request" aria-label="작업 요청" placeholder="예: 노란 테이프를 집어줘" required maxlength="160"><button id="submit" disabled>집기 요청</button></form><button type="button" class="stop" id="cancel">작업 중단</button><button type="button" id="reset" disabled>픽 스테이션 초기화</button><div class="small error" id="message" role="status"></div><div class="small muted" id="blocked"></div><div class="small muted" id="stageContext"></div><div id="stages"></div></section>
<section class="card"><h2>관측 이미지</h2><div class="preview" id="preview"><div class="empty">새 요청의 촬영·탐지 결과가<br>이곳에 표시됩니다.</div></div><div class="assets" id="assets"></div><div class="result" id="result">아직 완료된 요청이 없습니다.</div><div class="small muted" id="recovery" hidden></div></section></div>
<section class="card bottom"><h2>진행 기록</h2><div class="logs" id="logs" aria-live="polite"></div></section>
<section class="card bottom"><h2>최근 요청</h2><div class="history" id="history">아직 요청이 없습니다.</div></section>
<footer>로컬 전용 · 작업 중에는 중복 요청을 받지 않습니다. 궤적 완료와 물체 집기 성공은 별도로 표시합니다.</footer>
</main><script>
const token='__TOKEN__';const $=id=>document.getElementById(id);let state=null,previewId=null,inFlight=false,resumeShown=false;
const operationNames={'top-pregrasp-check':'최상단 · 손끝 높이 점검','top-pick':'최상단 · 실물 파지','observe-rise-pick':'하단 관측 → 최상단 상승 → 집기','bottom-pick':'최하단 · 실물 파지','top-inspect':'최상단 · 카메라 검사','top-align':'최상단 · 베이스 좌우 정렬','top-align-pick':'최상단 · 통합 파지','resume-top-pick':'이전 관측으로 이어 집기'};
try{const saved=localStorage.getItem('pick-station-operation-v2');if(saved&&saved!=='resume-top-pick'&&operationNames[saved])$('operation').value=saved;}catch{}
const stageNames=[['CAPTURING','새 촬영'],['DETECTING','물체 탐지'],['GENERATING_GRASPS','파지 후보 생성'],['PLANNING','경로 계획·검사'],['EXECUTING','파지 실행'],['VERIFYING','결과 확인']];
function plannedStages(){const rows=stageNames.slice();if(state?.mode==='station'){if($('operation').value==='top-pregrasp-check')return [...rows.slice(0,4),['EXECUTING','열린 집게 접근·재촬영']];if($('operation').value==='resume-top-pick')return [['PREPARING_PICK','이전 관측·현재 자세 연결'],...rows.slice(3)];if($('operation').value==='top-pick')rows[5]=['VERIFYING','동작 완료 확인'];if($('operation').value==='top-inspect')return rows.slice(0,3);if($('operation').value==='top-align-pick')return [...rows.slice(0,3),['PLANNING','현재 위치 계획 · 필요 시 재배치·재계획'],rows[4],['VERIFYING','동작 완료 확인']];if($('operation').value==='top-align')return [...rows.slice(0,3),['ALIGNING','베이스 좌우 정렬']];if($('operation').value!=='top-pick')rows.splice(3,0,['PREPARING_PICK','장치 준비·재관측']);if($('operation').value==='observe-rise-pick')rows.splice(4,0,['LIFTING','리프트 상승']);}return rows;}
const resultNames={PREGRASP_OBSERVED:'손끝 점검 촬영 완료',OBSERVED_ONLY:'카메라 검사 완료',SUCCEEDED:'성공',FAILED:'실패',REPOSITION_REVIEW_REQUIRED:'현재 위치 경로 없음 · 재배치 검토',CANCELLED:'중단됨',UNVERIFIED:'파지 성공 확인 부족',PLANNED_ONLY:'계획 검증 완료',STOP_UNCONFIRMED:'정지 확인 필요'};
function seconds(n){return n==null?'—':n.toFixed(1)+'초'}
function updateOperation(){
  const interactive=state?.mode==='station';
  $('stationOptions').hidden=!interactive;
  if(!interactive)return;
  if(!state.accepting&&state.current?.operation&&operationNames[state.current.operation])$('operation').value=state.current.operation;
  $('resumeOption').hidden=!state.resume_source;
  if(state.accepting&&state.resume_source&&!resumeShown){resumeShown=true;$('operation').value='resume-top-pick';$('request').value=state.resume_source.text;}
  const resume=$('operation').value==='resume-top-pick';
  const adaptive=$('operation').value==='top-align-pick';
  const align=adaptive||$('operation').value==='top-align';
  const check=$('operation').value==='top-pregrasp-check';
  const top=check||resume||align||$('operation').value==='top-pick';
  const rise=$('operation').value==='observe-rise-pick';
  const physical=top||rise||$('operation').value==='bottom-pick';
  $('confirmLabel').textContent='리프트가 실제 '+(resume?'이전 상승 완료 높이':top?'최상단':'최하단')+'에 있고 양팔·리프트는 힘이 꺼져도 내려앉지 않게 받쳐 고정했으며 양쪽 그리퍼가 비어 있습니다. 준비 중 필요한 경우 모터 힘을 한 번 끄는 데 동의합니다.';
  if($('operation').value==='top-pick')$('confirmLabel').textContent+=' 본체는 고정된 상태로 팔만 시험합니다.';
  if(align)$('confirmLabel').textContent+=' 베이스 좌우로 30 cm 이상 비어 있고, 전원선 여유가 있으며, 이동 중 바로 정지할 수 있게 옆에서 지켜봅니다.';
  if(resume)$('confirmLabel').textContent+=' 베이스·물체·주변 장애물은 이전 하단 관측 그대로입니다.';
  $('bottomConfirm').hidden=!physical;
  $('operation').disabled=inFlight||!state.accepting;
  $('supportedBottom').disabled=inFlight||!state.accepting;
  $('operationHint').textContent=check?'베이스를 고정하고 열린 집게로 상판 위 점검 위치까지 접근합니다. 그 자리에서 촬영하고 정지합니다.':adaptive?'현재 위치에서 먼저 촬영하고 파지 경로를 검사합니다. 도달 가능한 경로가 있으면 바로 집습니다. 현재 후보의 경로가 소진되면 베이스를 한 번 옮기고, 정지를 확인한 뒤 새 촬영으로 다시 계획합니다.':align?'광각 RGB-D 한 번 → 물체 base 좌표 → 왼팔 목표 위치와의 차이만큼 베이스를 천천히 좌우 이동 → 정지 확인. 팔·리프트는 움직이지 않습니다. 이동 후에는 제어기 리셋과 «픽 스테이션 초기화»가 필요합니다.':resume?'저장된 하단 사진·좌표·후보를 사용합니다. 이전 실측 높이에 현재 엔코더 차이를 반영하고 현재 팔 자세로 다시 계획하며, 물체 재탐지와 리프트 상승은 반복하지 않습니다.':rise?'최하단에서 물체를 관측한 뒤 리프트를 올려 집습니다. 상승 통로와 받침의 간섭이 없는지 확인하세요.':$('operation').value==='top-pick'?'상단 유지 · 바퀴 검사와 리프트 이동 없음. 근거리 RGB-D 한 번 → 탐지 → 후보 → 경로·충돌 검사 → 물체 단면에서 높이 가산 없이 닫고 들어 올리기. 실행 전 사진 비교·파지 후 재촬영 없음. 성공 여부는 직접 확인합니다.':physical?'요청하면 자세 유지, 새 촬영, 충돌 검사, 왼팔 파지와 결과 확인이 진행됩니다.':'실제 D415로 촬영합니다. 깊이가 부족하면 근거리로 다시 촬영합니다. 카메라 검사에서는 팔이 움직이지 않습니다.';
  $('submit').textContent=check?'손끝 점검 요청':adaptive?'통합 파지 요청':align?'정렬 이동 요청':physical?'집기 요청':'촬영·후보 확인';
  $('submit').disabled=!state.accepting||inFlight||(physical&&!$('supportedBottom').checked);
}
$('operation').onchange=()=>{try{localStorage.setItem('pick-station-operation-v2',$('operation').value)}catch{}$('supportedBottom').checked=false;if(state)render(state);else updateOperation()};
$('supportedBottom').onchange=updateOperation;
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Pick-Token':token},body:JSON.stringify(data)});const value=await r.json();if(!r.ok)throw Error(value.error||r.status);return value}
$('form').onsubmit=async e=>{e.preventDefault();if(inFlight||$('submit').disabled)return;inFlight=true;$('submit').disabled=true;$('message').textContent='';try{const data={text:$('request').value};if(state?.mode==='station'){data.operation=$('operation').value;data.supported_empty_bottom=['bottom-pick','observe-rise-pick'].includes(data.operation)&&$('supportedBottom').checked;data.supported_empty_top=['top-pregrasp-check','top-pick','resume-top-pick','top-align','top-align-pick'].includes(data.operation)&&$('supportedBottom').checked;data.supported_startup_release=['top-pregrasp-check','top-pick','bottom-pick','observe-rise-pick','resume-top-pick','top-align','top-align-pick'].includes(data.operation)&&$('supportedBottom').checked;if(data.operation==='resume-top-pick')data.scene_unchanged=$('supportedBottom').checked}await post('/api/requests',data);if(state?.mode==='station')$('supportedBottom').checked=false}catch(e){$('message').textContent=e.message}finally{inFlight=false;await poll()}};
$('cancel').onclick=async()=>{try{const r=await post('/api/cancel',{});$('message').textContent=r.requested?'중단 요청을 보냈습니다. 정지 확인을 기다립니다.':'진행 중인 요청이 없습니다.'}catch(e){$('message').textContent=e.message}};
$('reset').onclick=async()=>{if(inFlight||$('reset').disabled)return;
const supported=!!state.reset_requires_support,nextTest=!!state.next_test_ready;
if(supported&&!confirm(nextTest?'물체를 치우고 양팔·리프트를 안정적으로 받쳤나요? 현재 자세와 모터 힘을 유지한 채 다음 시험을 준비합니다.':'물체를 제거하고 양팔·리프트를 받쳐 고정했나요? 확인하면 정지·연결 정리 후 새 요청을 준비합니다. 모터 힘을 끄거나 제어기를 자동 리셋하지 않습니다.'))return;
inFlight=true;$('reset').disabled=true;$('message').textContent='초기화 중…';
try{await post('/api/reset',{supported_empty:supported});$('supportedBottom').checked=false;$('message').textContent=nextTest?'현재 자세를 유지하며 다음 시험을 준비합니다.':supported?'초기화 완료 기록이 뜨면 받침을 유지하고 제어기를 한 번 리셋하세요.':'초기화 요청을 보냈습니다.'}
catch(e){$('message').textContent=e.message}finally{inFlight=false;await poll()}};
function render(s){state=s;$('reset').textContent=s.next_test_ready?'다음 시험 준비':'픽 스테이션 초기화';$('reset').disabled=!s.reset_available||inFlight;$('connection').textContent=s.connected?(s.mode==='watch'?'상태 파일 갱신 중':'실행기 연결됨'):s.phase==='STARTING'?'모델 준비 중':'실행기 연결 안 됨';
const modes={station:'Jetson 연결 · 리프트 위치에 맞는 작업을 선택하세요.',demo:'모의 실행 · 실제 카메라·모델·모터를 사용하지 않습니다.',replay:'저장 영상 재생 · 실제 모델과 MoveIt을 사용하며 로봇에는 연결하지 않습니다.',watch:'기존 실행기 관찰 · 상태 파일을 읽습니다. 로봇 제어 기능은 없습니다.',live:'실제 장치 모드 · 요청 시 카메라와 로봇팔이 동작합니다.'};$('mode').textContent=(modes[s.mode]||s.mode)+(s.mode_detail?' '+s.mode_detail:'');$('mode').classList.toggle('live',s.mode==='live'||s.mode==='station');
$('phase').textContent=s.phase_label;$('detail').textContent=s.mode==='watch'?'원본 상태: '+s.raw_status+(s.detail?' · 동작: '+s.detail:''):(s.current?.prompt?'탐지 대상 · '+s.current.prompt:'');$('cancel').disabled=s.controls_enabled===false||!s.connected||(s.mode==='station'&&!s.current&&s.accepting);$('request').disabled=s.controls_enabled===false;$('submit').disabled=!s.accepting||inFlight;$('blocked').textContent=s.blocked_reason||'';updateOperation();
const c=s.current,nextPreview=s.mode==='station'&&s.accepting&&(!c||!!c.result),displayCurrent=c&&!nextPreview;
$('stageContext').textContent=s.mode==='station'?(displayCurrent?'실행 기록 · '+(operationNames[c.operation]||''):'다음 요청 · '+(operationNames[$('operation').value]||'')):'';
const rows=displayCurrent?c.stages:plannedStages().map(([id,label])=>({id,label,status:'waiting'}));$('elapsed').textContent=s.mode==='watch'?'상태 파일 갱신 후 '+seconds(s.source_age_s)+' · 단계별 시간은 실행기 기록이 필요합니다.':'초기 준비 '+seconds(s.startup_seconds)+(displayCurrent?' · 요청 소요 '+seconds(c.duration_s??Math.max(0,s.server_time_s-c.started_s)):'');
$('stages').replaceChildren(...rows.map((r,i)=>{const el=document.createElement('div');el.className='stage '+r.status;const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const label=document.createElement('span');label.textContent=r.label;const t=document.createElement('span');t.className='small';t.textContent=r.status==='running'?(r.started_s==null?'진행 중':seconds(Math.max(0,s.server_time_s-r.started_s))):r.status==='waiting'?'대기':r.status==='unknown'?'기록 없음':r.status==='skipped'?'생략':r.status==='done'&&r.seconds==null?'완료':seconds(r.seconds);el.append(num,label,t);return el}));
const assets=c?.artifacts||[],im=assets.filter(x=>x.image).at(-1);if(im?.id!==previewId){previewId=im?.id;$('preview').replaceChildren();if(im){const a=document.createElement('a');a.href='/api/artifacts/'+im.id;a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=a.href;img.alt=im.label;a.append(img);$('preview').append(a)}else{$('preview').textContent='현재 요청에 표시할 촬영 이미지가 없습니다.'}}
$('assets').replaceChildren(...assets.map(x=>{const a=document.createElement('a');a.href='/api/artifacts/'+x.id;a.textContent=x.label;a.target='_blank';a.rel='noopener';return a}));
const r=c?c.result:s.last_result;$('result').textContent=r?(nextPreview&&c?'이전 작업 · '+(operationNames[c.operation]||'')+' · ':'')+(s.mode==='demo'?'[모의 결과] ':'')+(r.verification_basis==='operator_observation'?'동작 완료 · 사용자 확인 필요':(resultNames[r.status]||r.status))+' · '+r.reason:'작업 결과를 기다리고 있습니다.';
$('recovery').hidden=!r?.recovery;$('recovery').textContent=r?.recovery?(r.recovery.reason+(r.recovery.base_reposition_candidate?' 이동 후에는 이전 경로를 재사용하지 않고 새 촬영부터 다시 계산합니다.':'')):'';
$('logs').textContent=s.events.slice().reverse().map(e=>(e.at?new Date(e.at).toLocaleTimeString('ko-KR')+'  ':'')+e.message).join('\n');
$('history').replaceChildren(...s.history.map(r=>{const el=document.createElement('span');el.textContent=r.text+' · '+(resultNames[r.status]||r.status)+' · '+seconds(r.duration_s);return el}));}
async function poll(){try{const r=await fetch('/api/status',{signal:AbortSignal.timeout(2500)});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){$('connection').textContent='서버 연결 끊김';$('reset').disabled=true;$('submit').disabled=true;$('cancel').disabled=true;$('blocked').textContent='화면에 남은 상태는 마지막으로 받은 값입니다.'}}
async function refreshLoop(){await poll();setTimeout(refreshLoop,500)}refreshLoop();
</script></body></html>
