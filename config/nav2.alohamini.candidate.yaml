/offline_nav2/amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /offline_nav2/scan
    map_topic: /offline_nav2/map
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.01
    laser_model_type: likelihood_field
    laser_max_range: 3.5
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    min_particles: 100
    max_particles: 500
    update_min_d: 0.02
    update_min_a: 0.02
    resample_interval: 1
    transform_tolerance: 0.5
    set_initial_pose: true
    initial_pose:
      x: -1.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    first_map_only: true
    always_reset_initial_pose: false
    tf_broadcast: true
