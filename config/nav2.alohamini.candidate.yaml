# AlohaMini candidate; exercised with the existing real Nav2/C-plant runner.
# /offline_nav2 is isolated: this file does not authorize a physical cmd_vel bridge.
# Source: ROBOTIS turtlebot3 jazzy burger.yaml (DWB, progress/goal checker,
# failure_tolerance); retain OmniMotionModel and our full fixed lift footprint.
# Recorded command candidate: s4_base.command-candidate.json (raw <= 200).
# Floor response/deadband still needs supervised validation; no auto-enable.
# Transit tolerance 10cm/0.17rad; manipulation alignment remains a separate phase.
# Merge nav2.depth.simulation.yaml for the independently verified depth-grid layer.
/offline_nav2/planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
/offline_nav2/controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    enable_stamped_cmd_vel: false
    odom_topic: /offline_nav2/odom
    min_x_velocity_threshold: 0.0002
    min_y_velocity_threshold: 0.0002
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.17
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.016
      min_vel_y: -0.013
      max_vel_y: 0.013
      max_vel_theta: 0.09
      min_speed_xy: 0.0
      max_speed_xy: 0.02
      min_speed_theta: 0.0
      acc_lim_x: 0.03
      acc_lim_y: 0.03
      acc_lim_theta: 0.15
      decel_lim_x: -0.03
      decel_lim_y: -0.03
      decel_lim_theta: -0.15
      vx_samples: 12
      vy_samples: 9
      vtheta_samples: 20
      # At 1.6 cm/s a 1.5 s trajectory stays in one 5 cm cost cell, so DWB
      # cannot distinguish forward progress from zero. Keep a useful horizon.
      sim_time: 4.0
      linear_granularity: 0.01
      angular_granularity: 0.05
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.002
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      Oscillation.oscillation_reset_time: 1.0
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      ObstacleFootprint.scale: 0.05
    failure_tolerance: 0.3
/offline_nav2/bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /offline_nav2/odom
    bt_loop_duration: 10
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
/offline_nav2/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    update_frequency: 5.0
    publish_frequency: 2.0
    resolution: 0.05
    track_unknown_space: true
    transform_tolerance: 0.3
    plugins:
    - static_layer
    - obstacle_layer
    - inflation_layer
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /offline_nav2/map
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: scan
