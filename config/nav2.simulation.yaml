# PC-only: synthetic scan/odometry and unmeasured robot footprint.
# D415 is intentionally absent from navigation inputs.
/offline_nav2/planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
/offline_nav2/controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
    odom_topic: /offline_nav2/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.1
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.35
      min_vel_y: -0.25
      max_vel_y: 0.25
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.5
      vx_samples: 10
      vy_samples: 7
      vtheta_samples: 15
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.08
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      # Release a direction-change lock after a bounded pause at the goal.
      # Keep the independent 10 s progress timeout active.
      Oscillation.oscillation_reset_time: 1.0
      BaseObstacle.scale: 0.05
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
/offline_nav2/bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /offline_nav2/odom
    bt_loop_duration: 10
    default_server_timeout: 500
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
/offline_nav2/global_costmap/global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    update_frequency: 5.0
    publish_frequency: 2.0
    robot_radius: 0.23
    resolution: 0.05
    track_unknown_space: true
    transform_tolerance: 0.3
    plugins: [static_layer, obstacle_layer, inflation_layer]
    static_layer:
      plugin: nav2_costmap_2d::StaticLayer
      map_topic: /offline_nav2/map
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: scan
      scan:
        topic: /offline_nav2/scan
        data_type: LaserScan
        marking: true
        clearing: true
        raytrace_max_range: 3.5
        obstacle_max_range: 3.4
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.4
      cost_scaling_factor: 3.0
/offline_nav2/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    rolling_window: true
    width: 4
    height: 4
    resolution: 0.05
    update_frequency: 10.0
    publish_frequency: 2.0
    robot_radius: 0.23
    transform_tolerance: 0.3
    plugins: [obstacle_layer, inflation_layer]
    obstacle_layer:
      plugin: nav2_costmap_2d::ObstacleLayer
      observation_sources: scan
      scan:
        topic: /offline_nav2/scan
        data_type: LaserScan
        marking: true
        clearing: true
        raytrace_max_range: 3.5
        obstacle_max_range: 3.4
    inflation_layer:
      plugin: nav2_costmap_2d::InflationLayer
      inflation_radius: 0.4
      cost_scaling_factor: 3.0
/offline_nav2/amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /offline_nav2/scan
    map_topic: /offline_nav2/map
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.01
    laser_model_type: likelihood_field
    laser_max_range: 3.5
    laser_min_range: 0.12
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    min_particles: 100
    max_particles: 500
    update_min_d: 0.02
    update_min_a: 0.02
    resample_interval: 1
    transform_tolerance: 0.5
    set_initial_pose: true
    initial_pose:
      x: -1.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    first_map_only: true
    always_reset_initial_pose: false
    tf_broadcast: true
