<div id="s2-lift-endpoints">
  <style>
    #s2-lift-endpoints {--s2-lift-moving:var(--yellow);--s2-lift-contact:color-mix(in srgb,var(--red) 55%,var(--purple));}
    #s2-lift-endpoints .lift-panels {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:12px}
    #s2-lift-endpoints .lift-stage {position:relative;height:470px}
    #s2-lift-endpoints canvas,#s2-lift-endpoints svg {position:absolute;inset:0;width:100%;height:100%}
    #s2-lift-endpoints svg {touch-action:none;cursor:grab}
    #s2-lift-endpoints svg text {fill:var(--foreground);font-size:12px;paint-order:stroke;stroke:var(--background);stroke-width:3px}
    #s2-lift-endpoints .lift-title {display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
    @media(max-width:600px){#s2-lift-endpoints .lift-panels {grid-template-columns:1fr}#s2-lift-endpoints .lift-stage {height:430px}}
  </style>
  <strong>리프트 최저·최고 위치 비교</strong>
  <div class="text-small" data-basis></div>
  <div class="viz-controls" aria-label="리프트 비교 시점">
    <button class="btn" type="button" data-view="iso" aria-pressed="true">입체</button>
    <button class="btn" type="button" data-view="front" aria-pressed="false">정면</button>
    <button class="btn" type="button" data-view="side" aria-pressed="false">측면</button>
    <button class="btn" type="button" data-zoom aria-pressed="false">접촉부 확대</button>
  </div>
  <div class="lift-panels">
    <section data-end="low"><div class="lift-title"><strong>최저 · 베이스 판 접촉</strong><span data-height></span></div><div class="lift-stage"><canvas aria-hidden="true"></canvas><svg role="img" aria-label="리프트 이동부 하단이 베이스 판 윗면에 닿는 CAD 위치"></svg></div></section>
    <section data-end="high"><div class="lift-title"><strong>최고 · 더듬이 받침 접촉</strong><span data-height></span></div><div class="lift-stage"><canvas aria-hidden="true"></canvas><svg role="img" aria-label="세로 슬라이더 윗끝이 더듬이 받침의 두꺼운 밑단에 닿는 CAD 위치"></svg></div></section>
  </div>
  <div class="text-small" role="status">노랑: 이동부 · 밝은 회색: 고정부 · 분홍 원/면: 접촉 위치</div>
  <div class="text-small" data-wheel-note></div>
  <script type="application/json" data-role="data">/*__S2_DATA__*/</script>
  <script>/*__S2_SCRIPT__*/</script>
</div>
