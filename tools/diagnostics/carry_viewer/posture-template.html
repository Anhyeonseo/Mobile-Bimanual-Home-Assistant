<div id="carry-posture-view">
  <h2>공통 복귀 자세와 물체별 조정</h2>
  <div class="viz-controls">
    <label class="form-label">물체<select class="form-select" data-role="case"></select></label>
    <label class="form-label">보는 방향<select class="form-select" data-role="view"><option value="arm-iso">팔 확대 · 입체</option><option value="arm-side">팔 확대 · 옆</option><option value="whole">로봇 전체</option></select></label>

  <div data-role="metric" class="tabular-nums" aria-live="polite"></div>

  <script type="application/json" data-role="data">__DATA__</script>
</div>

#carry-posture-view .posture-scene canvas,#carry-posture-view .posture-scene svg{position:absolute;inset:0;width:100%;height:100%;}
