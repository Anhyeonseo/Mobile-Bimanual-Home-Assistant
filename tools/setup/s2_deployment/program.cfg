source [find interface/stlink.cfg]
adapter serial 005100393235511438363730
transport select hla_swd
source [find target/stm32g4x.cfg]
adapter speed 1000
reset_config none
stm32g4x.cpu configure -event examine-end {}
stm32g4x.cpu configure -event reset-init {}
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
reset halt
flash probe 0
dump_image @DIAGNOSTICS@/preflash-full.bin 0x08000000 0x80000
flash write_image erase @RELEASE@/firmware.hex
verify_image @RELEASE@/firmware.hex
dump_image @DIAGNOSTICS@/boot-journal-after.bin 0x0807e000 0x2000
reset run
shutdown
